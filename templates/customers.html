{% extends "base.html" %}

{% block content %}
    <h1 class="text-dark">Customers</h1>
    <a href="{{ url_for('add_customer') }}" class="btn btn-primary mb-3">Add New Customer</a>

    <div class="table-responsive">
        <table class="table table-striped table-dark">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for customer in customers %}
                    <tr>
                        <td>{{ customer.name }}</td>
                        <td>{{ customer.email }}</td>
                        <td>{{ customer.phone }}</td>
                        <td>{{ customer.address }}</td>
                        <td>
                            <a href="{{ url_for('edit_customer', id=customer.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
